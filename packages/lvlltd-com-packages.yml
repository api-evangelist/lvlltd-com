summary: >-
  LVL LTD publishes first-party client libraries, but none of them in a package registry. Five clients
  are served as raw source files from the provider's own CDN-backed host: four ES modules under
  https://lvlltd.com/sdk/ (agent-shop, ap2-shopping-agent, a2a-client, a2a-mcp-bridge) and one Python
  module at /sdk/python/lvl_shop.py. Every URL is UNPINNED — there is no version segment, no registry
  metadata endpoint and no version constant inside the files — so a consumer cannot tell which build
  they are importing, and neither can we. The "npx lvl-skills" CLI that the agent card (install_skill),
  the MCP initialize instructions and llms.txt all advertise does NOT exist on npm
  (registry.npmjs.org/lvl-skills -> 404, and a full-text npm search for lvlltd returned nothing), so the
  advertised install path is currently a dangling pointer. The operator's GitHub account holds the
  site source (lvlltd-skill-marketplace, lvlltd-agentic-marketplace) and one published skill repo
  (agent-memory), none of which is a client library.
