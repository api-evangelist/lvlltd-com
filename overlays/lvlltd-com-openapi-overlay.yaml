info:
  title: API Evangelist enhancements for LVL LTD Agent Skill Market API
  version: 1.0.0
  description: Adds the operationIds, tags, securitySchemes and contact/terms metadata the published spec (https://lvlltd.com/openapi.json,
    1.6.0) omits. Names come from the providers own docs; nothing is added that the docs do not describe.
