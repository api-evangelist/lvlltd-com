- target: $.components
  update:
    securitySchemes:
      x402_payment_proof:
        type: apiKey
        in: header
        name: X-PAYMENT
        description: 'x402 payment proof after a GET /api/pay 402 challenge and a Base USDC transfer: JSON {"txHash":"0x…","skill":"<id>"}.
          Idempotent on (txHash, skill).'
      x402_payment_signature:
        type: apiKey
        in: header
        name: PAYMENT-SIGNATURE
        description: Signed EIP-3009 typed data (wallet_next_action from the 402) verified and settled through the Coinbase
          CDP facilitator.
      ap2_mandate:
        type: apiKey
        in: header
        name: X-AP2-MANDATE
        description: Optional AP2 Intent Mandate id or full mandate for verified_authorized_purchase.
- target: $.paths['/api/pay'].post
  update:
    security:
    - x402_payment_proof: []
    - x402_payment_signature: []
- target: $.paths['/api/pay'].get
  update:
    x-payment-challenge-headers:
    - PAYMENT-REQUIRED
    - X-PAYMENT-REQUIRED
    x-note: HTTP 402 is the quote, not an error; agents read maxAmountRequired/payTo from the body or accepts[0].
