- target: $.info
  update:
    x-apievangelist-enrichment:
      generated: '2026-09-19'
      provenance: API Evangelist overlay; the harvested spec is unchanged in openapi/_original/
    termsOfService: https://lvlltd.com/terms/
    contact:
      name: LVL LTD CO
      url: https://lvlltd.com
      email: support@lvlltd.com
