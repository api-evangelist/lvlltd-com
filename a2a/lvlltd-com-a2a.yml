conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications, stateTransitionHistory and extendedAgentCard. protocolVersion is present at the
    top level (pass), declared "1.0.0". skills is an ARRAY (pass) of eleven fully-populated skills, each
    with id, name, description, tags, examples, inputModes and outputModes. All three optional
    discriminators are present: preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes.
    The card carries BOTH the 1.0.0 supportedInterfaces[] block (url + protocolBinding + protocolVersion)
    and the older top-level url/preferredTransport triple, so readers written against either revision
    find what they look for.
  deviations:
  - field: supportedInterfaces[0].protocolVersion vs protocolVersion
    observed: "'1.0' inside the interface, '1.0.0' at the top level"
    note: Two spellings of the same version in one document. Harmless to a lenient reader, but a strict semver comparison of the two fields fails.
  - field: additionalInterfaces[]
    observed: five entries mixing an A2A interface with MCP, REST shop, x402 pay and catalog.json URLs, each carrying non-standard keys (protocol, payment, note)
    note: >-
      A2A additionalInterfaces is meant for alternative transports of the SAME agent. Here it is used as a
      general discovery list for the provider's other protocols, which is useful but not what the field
      means; a client iterating it as A2A transports will try to speak JSON-RPC to /api/shop.
  - field: extensions[]
    observed: declared at the top level rather than under capabilities.extensions, and only one of eight URIs (https://ap2-protocol.org/extension/v1) is an A2A extension identifier; the rest are documentation pointers
    note: A 1.0.0 reader looks for capabilities.extensions[]; it will see none and treat the AP2 extension as absent.
  - field: security / securitySchemes
    observed: security is an empty array; the two securitySchemes describe payment-proof headers (X-PAYMENT, X-AP2-MANDATE) typed as apiKey
    note: >-
      Access is economic, not credential-based: discovery is anonymous and money moves over x402 on
      /api/pay, never inside A2A. The apiKey typing is a stretch (the header carries a transaction hash or
      a signed payment payload, not a key), but it is an honest description of where the proof goes.
  - field: signatures[] / signatureMeta
    observed: one EdDSA JWS (kid lvl-a2a-1, JWKS published) signedAt 2026-07-28, plus a non-standard signatureMeta block whose note describes the operator's re-signing procedure and private-key file name
    note: >-
      A signed card with a resolvable JWKS is rare and good. The signedAt predates the later body edits
      the note itself describes ("Body updated for AP2 ... re-sign"), and our verification attempt over
      JCS(card without signatures) is recorded in the enrichment report; treat the signature as
      published-but-unverified-by-us rather than proven.
  - field: catalogSkillCount / inventory / about
    observed: non-standard top-level fields
    note: Extra fields are permitted; recorded so a strict schema validator's complaint is expected.
