    public skills). Free outlines before pay; confirmed purchases on public /api/proof only. Payment settles
    via x402 HTTP, not inside A2A JSON-RPC. Optional AP2 mandates and ERC-8004 identity are additive.
  url: https://lvlltd.com/api/a2a
  version: 1.5.0
  protocol_version: 1.0.0
  preferred_transport: JSONRPC
  provider:
    organization: LVL LTD CO
    url: https://lvlltd.com
  documentation_url: https://lvlltd.com/about/
  icon_url: https://lvlltd.com/favicon.svg
