surface_relationship:
  note: >-
    LVL publishes four agent surfaces on one host and they are projections of one catalog. A2A: eleven
    marketplace-operation skills at https://lvlltd.com/api/a2a. MCP: 59 tools at https://lvlltd.com/api/mcp,
    five of which (a2a_discover, a2a_message_send, a2a_tasks_get, a2a_tasks_cancel, a2a_bridge_info) wrap
    the A2A endpoint, and a2a_bridge_info documents the reverse wrap. REST: 32 operations, of which GET
    /api/pay (402 challenge) and POST /api/pay (X-PAYMENT unlock) are the only operations that move value,
    and every A2A purchase skill and paid MCP tool ultimately routes there (see
    mcp/lvlltd-com-tool-crosswalk.yml). The ERC-8004 registration file at /.well-known/erc8004-agent.json
    lists all four endpoints under one agent name.
