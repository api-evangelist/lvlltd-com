tags: [Agent Skills, x402, Micropayments, Subscriptions]
description: >-
  LVL LTD sells access three ways, all priced in USD and settled in USDC on Base over x402 unless stated:
  (1) one-time sealed-pack unlocks per skill, perpetual, from $0.002 to a stated live list cap of $0.99
  (250 skills; catalog median $0.99, mean $0.87, list sum $217.03; the $0.05 canary is the intended first
  purchase); (2) six recurring plans read from /api/subscribe — three Catalog Live tiers that give live
  MCP access plus metered tool calls, an Update Pass, a renewing bundle, and a default pay-per-use meter;
  (3) $0.99 bundles that unlock several skills for one payment. One product ("Quiet Close", a $19 digital
  file) is sold by card through Stripe and is not an API product. One-time unlocks are never revoked by a
  subscription lapse; every recurring plan cancels in one POST.
plan_count: 9
currency: USD
settlement: USDC on Base (eip155:8453), x402; USDbC accepted; Stripe card for the one non-API digital good
