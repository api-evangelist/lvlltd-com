openapi: 3.2.0
info:
  title: LVL LTD Agent Skill Market Catalog API
  version: 1.6.0
  description: 'ESP (Evaluate→Settle→Prove) + x402 skill marketplace. Free eval always before settlement. Success only via /api/proof. Source: catalog.json.'
  contact:
    name: LVL LTD CO
    url: https://lvlltd.com
servers:
- url: https://lvlltd.com
tags:
- name: Catalog
paths:
  /api/catalog:
    get:
      summary: Search catalog
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: max_price
        in: query
        schema:
          type: number
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Results
      tags:
      - Catalog
      operationId: getApiCatalog
      x-operation-id-source: derived
x-lvl-skill-count: 250
x-lvl-source-of-truth: catalog.json
