openapi: 3.2.0
info:
  title: LVL LTD Agent Skill Market Skills API
  version: 1.6.0
  description: 'ESP (Evaluate→Settle→Prove) + x402 skill marketplace. Free eval always before settlement. Success only via /api/proof. Source: catalog.json.'
  contact:
    name: LVL LTD CO
    url: https://lvlltd.com
servers:
- url: https://lvlltd.com
tags:
- name: Skills
paths:
  /skills/{id}/outline.json:
    get:
      summary: Free skill outline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Outline
      tags:
      - Skills
      operationId: getSkillsByIdOutlineJson
      x-operation-id-source: derived
  /skills/{id}/sample.md:
    get:
      summary: Free skill sample
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sample
      tags:
      - Skills
      operationId: getSkillsByIdSampleMd
      x-operation-id-source: derived
x-lvl-skill-count: 250
x-lvl-source-of-truth: catalog.json
