openapi: 3.2.0
info:
  title: Lvlltd Com Skills API
  version: 1.6.0
  contact:
    name: LVL LTD CO
    url: https://lvlltd.com
  description: 'Operations tagged Skills across 2 of this provider''s published API definitions: lvlltd-com-openapi.json, lvlltd-com-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://lvlltd.com
tags:
- name: Skills
paths:
  /skills/{id}/outline.json:
    get:
      summary: Free skill outline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Outline
      tags:
      - Skills
      operationId: getSkillsByIdOutlineJson
      x-operation-id-source: derived
    servers:
    - url: https://lvlltd.com
  /skills/{id}/sample.md:
    get:
      summary: Free skill sample
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sample
      tags:
      - Skills
      operationId: getSkillsByIdSampleMd
      x-operation-id-source: derived
    servers:
    - url: https://lvlltd.com
x-refined-from:
- lvlltd-com-openapi.json
- lvlltd-com-openapi.yml
x-lvl-skill-count: 250
x-lvl-source-of-truth: catalog.json
