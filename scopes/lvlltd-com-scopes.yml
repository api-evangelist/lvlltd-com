summary: >-
  LVL LTD publishes an OAuth scope LIST but no OAuth server. The RFC 9728 protected-resource document on
  the apex declares four scopes_supported and names https://lvlltd.com as its authorization server, yet
  that host serves neither /.well-known/oauth-authorization-server (404) nor
  /.well-known/openid-configuration (404), the OpenAPI declares no oauth2 securityScheme, and no docs page
  explains how a token would be obtained or which operation would accept one. derive-oauth-scopes.py
  therefore found nothing in the spec. The scopes are recorded here because the provider published them;
  they are, today, unobtainable.
