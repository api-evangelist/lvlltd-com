finding: >-
  A dangling delegated-identity declaration: the resource document is the half of RFC 9728 a resource
  server publishes, and it is well-formed, but the authorization-server half it points at does not
  exist. An MCP client following the 2025-06-18 authorization flow would fetch this document, follow
  authorization_servers[0], and fail at the metadata step.
