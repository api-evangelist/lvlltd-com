source: >-
  Derived by aligning the live MCP tools/list (59 tools with inputSchema, fetched anonymously from
  https://lvlltd.com/api/mcp on 2026-09-19, saved as mcp/lvlltd-com-mcp-tools-list.json) with the
  provider's OpenAPI 3.1.0 (openapi/lvlltd-com-openapi.yml, 32 operations across 26 paths), and the A2A
  card's eleven skills. The published spec has NO operationIds; the ids used in rest[] below are the ones
  assigned by overlays/lvlltd-com-openapi-overlay.yaml (method + path is recorded on every row so the
  binding can be checked against the original).
purpose: >-
  Bind each agent-facing MCP tool to the REST operation that backs it so the tool inherits that
  operation's parameters as its real input contract, and record which tools have no public REST
  operation at all. LVL's REST, MCP and A2A surfaces are overlapping-but-divergent projections of one
  catalog: MCP is the widest (59 tools, of which 27 reach endpoints the OpenAPI never mentions), the
  OpenAPI is the narrowest, and A2A is a curated eleven-skill front door that itself bridges to MCP.
