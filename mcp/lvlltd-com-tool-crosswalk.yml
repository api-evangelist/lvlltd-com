  mcp: https://lvlltd.com/api/mcp
  mcp_note: tools/list answered 200 without credentials; every tool carries an inputSchema.
  a2a: https://lvlltd.com/api/a2a
  a2a_note: eleven skills in the card; a2a_discover / a2a_message_send / a2a_tasks_get / a2a_tasks_cancel MCP tools wrap this endpoint (mcpWrapsA2a), and the endpoint advertises the reverse (a2aWrapsMcp).
