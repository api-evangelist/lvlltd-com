  registry_status: PUBLISHED. registry.modelcontextprotocol.io/v0/servers?search=com.lvlltd/skill-market
    returned the server on 2026-09-19 with _meta io.modelcontextprotocol.registry/official status "active"
    (statusChangedAt 2026-08-09), version 1.5.0, remotes[0] streamable-http https://lvlltd.com/api/mcp.
    The server.json's repository field points at https://github.com/lvlltd/lvlltd-agent-marketplace, which
    does not exist (github.com/lvlltd and the repo path both return HTML 404); the operator's real account
    is https://github.com/omgawdmadeit1, where lvlltd-agentic-marketplace and lvlltd-skill-marketplace
    hold the source.
  instructions_excerpt: '"LVL ESP skill market (Evaluate -> Settle -> Prove) + SCO (Sealed Consensus Oracles)
    + MCP + A2A + P2 rails + agent runtime. Preferred: esp_discover -> esp_evaluate|esp_cycle(skill) ->
    free outline -> quote_skill -> pay USDC on Base (eip155:8453) -> purchase_skill|install_skill_payload(tx_hash)
    -> verify_unlock (/api/proof only). ... Free eval before settlement. Never invent unlock counts."'
auth:
  methods:
  - none
  note: 'Discovery and every free tool are anonymous. Tools that unlock a sealed pack do not settle money
    inside MCP: purchase_skill without tx_hash returns the x402 402 challenge (amount, payTo, asset) plus
    an unsigned EIP-3009 wallet_next_action; the caller pays USDC on Base out of band and calls again
    with tx_hash. No API key, OAuth or bearer token exists on this server. The /.well-known/oauth-protected-
    resource document on the host names https://lvlltd.com as an authorization server, but that host serves
    no RFC 8414 metadata (404) — see conformance/.'
