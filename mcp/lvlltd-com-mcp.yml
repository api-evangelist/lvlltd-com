    "LVL ESP skill market (Evaluate -> Settle -> Prove) + SCO (Sealed Consensus Oracles) + MCP + A2A + P2
    rails + agent runtime. Preferred: esp_discover -> esp_evaluate|esp_cycle(skill) -> free outline ->
