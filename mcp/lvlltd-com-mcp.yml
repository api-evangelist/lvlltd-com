auth:
  methods: [none]
  note: >-
    Discovery and every free tool are anonymous. Tools that unlock a sealed pack do not settle money inside
    MCP: purchase_skill without tx_hash returns the x402 402 challenge (amount, payTo, asset) plus an
    unsigned EIP-3009 wallet_next_action; the caller pays USDC on Base out of band and calls again with
    tx_hash. No API key, OAuth or bearer token exists on this server. The /.well-known/oauth-protected-
    resource document on the host names https://lvlltd.com as an authorization server, but that host
    serves no RFC 8414 metadata (404) — see conformance/.
