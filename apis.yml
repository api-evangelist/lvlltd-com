- aid: lvlltd-com:lvl-ltd-mcp-server
  name: LVL LTD MCP Server
  description: >-
    Remote Model Context Protocol server at https://lvlltd.com/api/mcp (alias /mcp; HTTP JSON-RPC,
    protocol version 2025-06-18, serverInfo lvlltd-skill-market 1.1.0). initialize and tools/list answer
    anonymously with 59 tools, each carrying a real inputSchema: catalog search and quoting, x402
    purchase and unlock, proof verification, recurring plans and metering, the ESP and SCO protocol
    tools, an A2A bridge (a2a_discover, a2a_message_send, a2a_tasks_get, a2a_tasks_cancel), agent
    runtime helpers (KV memory, long-running tasks, event bus, decision receipts) and the Bankr x402
    Cloud rail. Paid tools return a real 402 challenge rather than settling money inside MCP. A
    registry-shaped server.json is published at /discovery/mcp-server.json.
  humanURL: https://lvlltd.com/llms.txt
  baseURL: https://lvlltd.com/api/mcp
  tags:
