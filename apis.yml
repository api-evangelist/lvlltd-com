apis:
- aid: lvlltd-com:lvl-ltd-mcp-server
  name: LVL LTD MCP Server
  description: >-
    Remote Model Context Protocol server at https://lvlltd.com/api/mcp (alias /mcp; HTTP JSON-RPC, protocol
    version 2025-06-18, serverInfo lvlltd-skill-market 1.1.0). initialize and tools/list answer anonymously
    with 59 tools, each carrying a real inputSchema: catalog search and quoting, x402 purchase and unlock,
    proof verification, recurring plans and metering, the ESP and SCO protocol tools, an A2A bridge (a2a_discover,
    a2a_message_send, a2a_tasks_get, a2a_tasks_cancel), agent runtime helpers (KV memory, long-running
    tasks, event bus, decision receipts) and the Bankr x402 Cloud rail. Paid tools return a real 402 challenge
    rather than settling money inside MCP. A registry-shaped server.json is published at /discovery/mcp-server.json.
  humanURL: https://lvlltd.com/llms.txt
  baseURL: https://lvlltd.com/api/mcp
  tags:
  - MCP
  - Agent-Native
  - Agentic Commerce
  tags_raw:
  - MCP
  - agent-native
  - Agent Commerce
  properties:
  - type: MCPServer
    url: mcp/lvlltd-com-mcp.yml
  - type: MCPServer
    name: LVL LTD MCP endpoint (HTTP JSON-RPC)
    url: https://lvlltd.com/api/mcp
  - type: ToolCrosswalk
    url: mcp/lvlltd-com-tool-crosswalk.yml
- aid: lvlltd-com:lvl-ltd-a2a-agent
  name: LVL LTD Skill Market A2A Agent
  description: >-
    Agent2Agent surface: an Ed25519-JWS-signed agent card (protocolVersion 1.0.0, JSONRPC transport, version
    1.5.0, JWKS at /.well-known/jwks.json) served from both /.well-known/agent-card.json and the legacy
    /.well-known/agent.json, declaring eleven skills — catalog search, skill details, x402 price quote
    and purchase, AP2 spending mandate and shopping-agent orchestration, explainability traces, unlock
    verification, install guidance, ERC-8004 identity lookup, demand signals and an MCP bridge. The JSON-RPC
    endpoint at https://lvlltd.com/api/a2a implements message/send, tasks/get, tasks/cancel and tasks/list
    with an eight-turn multi-turn task store (TTL 1800 s); streaming and push notifications are declared
    unsupported. Payment never settles inside A2A — it goes over x402 on /api/pay.
  humanURL: https://lvlltd.com/about/
  baseURL: https://lvlltd.com/api/a2a
  tags:
  - A2A
  - Agent-Native
  - x402
  tags_raw:
