- aid: lvlltd-com:lvl-ltd-agent-skill-market-api
  name: LVL LTD Agent Skill Market API
  description: >-
    REST contract for the x402 skill marketplace: health and readiness probes, the ESP
    (Evaluate -> Settle -> Prove) protocol root, catalog search and the full catalog.json, free per-skill
    outline.json and sample.md, the HTTP 402 payment challenge and X-PAYMENT unlock on /api/pay, the
    public confirmed-unlock proof ledger, AP2 mandates, ERC-8004 agent identity, access resolution,
    recurring plans, metered budgets, bundles, trust scorecards, security scans, eval scores, demand
    signals and a revenue rollup. 32 operations across 26 paths, published as OpenAPI 3.1.0 at
    https://lvlltd.com/openapi.json with servers[] https://lvlltd.com. The published spec carries no
    operationIds and no securitySchemes; the overlay in overlays/ adds both.
  humanURL: https://lvlltd.com/docs/
