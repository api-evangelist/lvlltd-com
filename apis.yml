    url: https://lvlltd.com/api/mcp
  - type: ToolCrosswalk
    url: mcp/lvlltd-com-tool-crosswalk.yml
- aid: lvlltd-com:lvl-ltd-a2a-agent
  name: LVL LTD Skill Market A2A Agent
  description: >-
    Agent2Agent surface: an Ed25519-JWS-signed agent card (protocolVersion 1.0.0, JSONRPC transport,
    version 1.5.0, JWKS at /.well-known/jwks.json) served from both /.well-known/agent-card.json and the
    legacy /.well-known/agent.json, declaring eleven skills — catalog search, skill details, x402 price
    quote and purchase, AP2 spending mandate and shopping-agent orchestration, explainability traces,
    unlock verification, install guidance, ERC-8004 identity lookup, demand signals and an MCP bridge.
    The JSON-RPC endpoint at https://lvlltd.com/api/a2a implements message/send, tasks/get, tasks/cancel
    and tasks/list with an eight-turn multi-turn task store (TTL 1800 s); streaming and push
    notifications are declared unsupported. Payment never settles inside A2A — it goes over x402 on
    /api/pay.
  humanURL: https://lvlltd.com/about/
  baseURL: https://lvlltd.com/api/a2a
