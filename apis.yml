aid: lvlltd-com
name: LVL LTD CO
description: >-
  LVL LTD CO is a sole-operator product lab in Cleveland, Georgia (operator Joseph Lamar Taylor; trade
  name, LLC registration stated as pending) that runs lvlltd.com, an agent-native marketplace of 250
  sealed AI-agent skill packs priced in USDC on Base (chain 8453) and settled over the x402 HTTP 402
  protocol. Every skill has a free outline and sample; payment is proven by posting a Base transaction
  hash (or an EIP-3009 PAYMENT-SIGNATURE) back to /api/pay, and the public /api/proof ledger is the
  only success signal the operator will stand behind. The same catalog is exposed four ways: a 32-operation
  OpenAPI 3.1.0 REST contract at /openapi.json, a remote MCP server at /api/mcp that answers an anonymous
  tools/list with 59 tools, an Ed25519-JWS-signed A2A 1.0.0 agent card at /.well-known/agent-card.json
  with a JSON-RPC endpoint at /api/a2a, and a full agent map in /llms.txt. Optional AP2 spend mandates,
  ERC-8004 identity lookups, recurring catalog-access plans and a Coinbase CDP facilitator path sit on
  top of the one-time unlock model.
