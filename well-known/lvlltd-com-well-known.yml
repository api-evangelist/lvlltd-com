summary: >-
  lvlltd.com serves a rich discovery surface from the apex host, which is also the OpenAPI servers[] host,
  the MCP host and the A2A host: security.txt (RFC 9116, Policy + Expires 2027-09-11), an RFC 9728
  oauth-protected-resource document, an api-catalog (RFC 9727-style Link lines served as text/plain),
  an A2A agent card at both the canonical and legacy paths, a JWKS, an x402 discovery document, an
  ERC-8004 registration file and llms.txt — and it returns real 404s (no SPA shell) for
  openid-configuration, oauth-authorization-server, ai-plugin.json, ucp/acp/aauth, apis.json and a
  negative-control path. The oauth-protected-resource document names https://lvlltd.com as its
  authorization server, yet that same host publishes no RFC 8414 or OIDC discovery — the delegated-
  identity chain is declared but dangling. www 301s to the apex; studio.lvlltd.com mirrors the apex
  files byte-for-byte; swarm.lvlltd.com serves its own, different agent card; music.lvlltd.com serves
  none of them.
