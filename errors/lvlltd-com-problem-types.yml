notes:
- The OpenAPI declares no 401/429/5xx responses at all; the 429 and 503 behaviours above come from prose, not the contract.
- Non-error signals an agent must not misread as failures: 402 on GET /api/pay (the quote), ready:false on /api/ready (rails degraded — do not buy), and an empty /api/proof (honest zero volume).
